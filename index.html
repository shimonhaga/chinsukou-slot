<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ちんすこうマシーン</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
    <!-- html2canvas for image generation -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: #fef9c3;
            background-image: radial-gradient(#fde047 15%, transparent 16%), radial-gradient(#fde047 15%, transparent 16%);
            background-size: 28px 28px;
            background-position: 0 0, 14px 14px;
        }
        .retro-font {
            font-family: 'DotGothic16', monospace;
        }
        .arcade-box {
            box-shadow: 0 10px 0 #b45309, 0 20px 25px -5px rgba(0, 0, 0, 0.2);
        }
        @keyframes pullLever {
            0% { transform: translateY(0); }
            50% { transform: translateY(18px); }
            100% { transform: translateY(0); }
        }
        .pulling {
            animation: pullLever 0.25s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 selection:bg-amber-400 selection:text-amber-950">

    <header class="text-center my-4">
        <h1 class="text-3xl md:text-5xl font-black text-amber-950 tracking-wide">
            ちんすこうマシーン
        </h1>
        <p class="text-amber-900 font-bold text-xs md:text-sm mt-1 bg-amber-100 inline-block mt-3 px-3 py-1 rounded-md border border-amber-300">
            「ち・ん・す・こ・う」の5文字で織りなす素敵な出会い
        </p>
    </header>

    <main class="w-full max-w-xl bg-amber-400 border-4 border-amber-900 rounded-3xl p-6 md:p-8 arcade-box relative my-auto">

        <!-- Status Badge -->
        <div id="statusBadge" class="absolute -top-3.5 right-6 bg-amber-100 border-2 border-amber-900 text-amber-900 font-black px-3 py-0.5 rounded-lg text-xs shadow-sm">
            スタンバイ中
        </div>

        <!-- Capture Target Card Area -->
        <div id="captureCard" class="bg-amber-400 p-2 rounded-2xl">
            <!-- Reels Display -->
            <div class="bg-amber-950 border-4 border-amber-900 rounded-2xl p-4 md:p-6 mb-4 shadow-inner relative overflow-hidden">
                <div class="absolute inset-0 bg-[linear-gradient(rgba(18,16,16,0)_50%,rgba(0,0,0,0.2)_50%)] bg-[length:100%_4px] pointer-events-none z-10"></div>

                <div class="grid grid-cols-5 gap-2 md:gap-3 relative z-0">
                    <div class="bg-amber-100 border-3 border-amber-800 rounded-xl h-24 md:h-32 flex items-center justify-center shadow-inner overflow-hidden">
                        <div id="reel0" class="retro-font text-4xl md:text-6xl font-bold text-amber-900">ち</div>
                    </div>
                    <div class="bg-amber-100 border-3 border-amber-800 rounded-xl h-24 md:h-32 flex items-center justify-center shadow-inner overflow-hidden">
                        <div id="reel1" class="retro-font text-4xl md:text-6xl font-bold text-amber-900">ん</div>
                    </div>
                    <div class="bg-amber-100 border-3 border-amber-800 rounded-xl h-24 md:h-32 flex items-center justify-center shadow-inner overflow-hidden">
                        <div id="reel2" class="retro-font text-4xl md:text-6xl font-bold text-amber-900">す</div>
                    </div>
                    <div class="bg-amber-100 border-3 border-amber-800 rounded-xl h-24 md:h-32 flex items-center justify-center shadow-inner overflow-hidden">
                        <div id="reel3" class="retro-font text-4xl md:text-6xl font-bold text-amber-900">こ</div>
                    </div>
                    <div class="bg-amber-100 border-3 border-amber-800 rounded-xl h-24 md:h-32 flex items-center justify-center shadow-inner overflow-hidden">
                        <div id="reel4" class="retro-font text-4xl md:text-6xl font-bold text-amber-900">う</div>
                    </div>
                </div>
            </div>

            <!-- Result Box -->
            <div id="resultBox" class="bg-amber-50 border-2 border-amber-800 rounded-xl p-4 text-center mb-2 shadow-sm min-h-[85px] flex flex-col items-center justify-center transition-all">
                <div id="resultTitle" class="text-sm md:text-base font-black text-amber-950">
                    レバーを引いて文字をシャッフルしよう
                </div>
                <div id="resultDesc" class="text-xs text-amber-800 font-bold mt-1">
                    どんな組み合わせになるかはお楽しみです。
                </div>
            </div>
        </div>

        <!-- Control Buttons -->
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 mb-3 mt-4">
            <button id="leverBtn" onclick="spinSlots()" class="col-span-2 bg-red-600 hover:bg-red-500 active:scale-95 text-amber-100 font-black text-base py-3.5 px-4 rounded-2xl shadow-[0_4px_0_#991b1b] active:shadow-[0_1px_0_#991b1b] active:translate-y-1 transition-all flex items-center justify-center gap-2 border-2 border-rose-300 cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
                レバーを引く
            </button>
            <button onclick="resetToNormal()" class="bg-amber-700 hover:bg-amber-600 active:scale-95 text-amber-100 font-bold py-3.5 px-2 rounded-2xl shadow-[0_4px_0_#78350f] active:shadow-[0_1px_0_#78350f] active:translate-y-1 transition-all text-xs border border-amber-500 cursor-pointer flex items-center justify-center">
                初期位置へ
            </button>
        </div>

        <!-- Sharing & Saving Row -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 mb-4">
            <button id="downloadBtn" onclick="downloadCardImage()" disabled class="bg-emerald-800/40 text-emerald-300/50 font-bold py-3 px-2 rounded-2xl transition-all text-xs border border-emerald-900/50 cursor-not-allowed flex items-center justify-center gap-1.5">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                </svg>
                画像保存
            </button>
            <button id="shareBtn" onclick="shareOnX()" disabled class="bg-slate-800/40 text-slate-400 font-bold py-3 px-2 rounded-2xl transition-all text-xs border border-slate-700/50 cursor-not-allowed flex items-center justify-center gap-1.5">
                <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                Xでシェア
            </button>
            <button id="copyUrlBtn" onclick="copyResultUrl()" disabled class="bg-amber-800/40 text-amber-200/50 font-bold py-3 px-2 rounded-2xl transition-all text-xs border border-amber-900/50 cursor-not-allowed flex items-center justify-center gap-1.5">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                </svg>
                URLをコピー
            </button>
        </div>

        <!-- Copy Feedback Banner -->
        <div id="copyToast" class="hidden mb-3 bg-emerald-100 border border-emerald-400 text-emerald-800 text-center text-xs font-bold py-1.5 rounded-lg shadow-2xs">
            URLをコピーしました！
        </div>

        <!-- History Section -->
        <div class="bg-amber-950/20 border border-amber-900/30 rounded-xl p-3">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-bold text-amber-900">履歴</span>
                <button onclick="clearHistory()" class="text-[10px] text-amber-800 hover:text-amber-950 underline font-bold cursor-pointer">クリア</button>
            </div>
            <div id="historyList" class="flex flex-wrap gap-1.5 min-h-[28px] items-center">
                <span class="text-xs text-amber-800/70 italic">まだ履歴はありません</span>
            </div>
        </div>

    </main>

    <footer class="text-center text-amber-900 font-bold text-xs mt-4 opacity-80">
        ちんすこうマシーン
    </footer>

    <script>
        const CHIN_CHARS = ['ち', 'ん', 'す', 'こ', 'う'];
        let isSpinning = false;
        let historyArray = [];
        let currentWord = 'ちんすこう';

        const reels = [
            document.getElementById('reel0'),
            document.getElementById('reel1'),
            document.getElementById('reel2'),
            document.getElementById('reel3'),
            document.getElementById('reel4')
        ];

        const statusBadge = document.getElementById('statusBadge');
        const resultBox = document.getElementById('resultBox');
        const resultTitle = document.getElementById('resultTitle');
        const resultDesc = document.getElementById('resultDesc');
        const leverBtn = document.getElementById('leverBtn');
        const shareBtn = document.getElementById('shareBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const copyUrlBtn = document.getElementById('copyUrlBtn');
        const copyToast = document.getElementById('copyToast');
        const historyList = document.getElementById('historyList');

        // Initialization & URL restoration
        window.addEventListener('DOMContentLoaded', () => {
            try {
                let targetWord = null;
                const urlParams = new URLSearchParams(window.location.search);
                targetWord = urlParams.get('word');

                if (!targetWord && window.location.hash) {
                    const hashParams = new URLSearchParams(window.location.hash.substring(1));
                    targetWord = hashParams.get('word');
                }

                if (targetWord && targetWord.length === 5) {
                    const isValid = targetWord.split('').every(char => CHIN_CHARS.includes(char));
                    if (isValid) {
                        currentWord = targetWord;
                        reels.forEach((reel, idx) => {
                            reel.textContent = currentWord[idx];
                        });
                        evaluateWord(currentWord);
                        addHistory(currentWord);
                        enableActionButtons(true);
                        return;
                    }
                }
            } catch (e) {
                console.log('URL parsing skipped due to environment restriction');
            }
            resetToNormal();
        });

        function resetToNormal() {
            if (isSpinning) return;
            currentWord = 'ちんすこう';
            reels.forEach((reel, idx) => {
                reel.textContent = currentWord[idx];
                reel.className = "retro-font text-4xl md:text-6xl font-bold text-amber-900";
            });
            statusBadge.textContent = "王道バランス";
            resultTitle.textContent = "王道の「ちんすこう」";
            resultDesc.textContent = "沖縄の伝統と安心感に満ちた正しい並びです。";
            resultBox.className = "bg-emerald-50 border-2 border-emerald-700 rounded-xl p-4 text-center mb-2 shadow-sm min-h-[85px] flex flex-col items-center justify-center";

            try {
                if (window.location.protocol !== 'blob:') {
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            } catch (e) {}
            enableActionButtons(true);
        }

        function spinSlots() {
            if (isSpinning) return;
            isSpinning = true;

            leverBtn.classList.add('pulling');
            setTimeout(() => leverBtn.classList.remove('pulling'), 250);

            statusBadge.textContent = "回転中…";
            resultTitle.textContent = "文字がパラパラとシャッフル中……";
            resultDesc.textContent = "どのような文字の並びになるでしょうか。";
            resultBox.className = "bg-amber-50 border-2 border-amber-800 rounded-xl p-4 text-center mb-2 shadow-sm min-h-[85px] flex flex-col items-center justify-center";

            enableActionButtons(false);

            let count = 0;
            const maxCounts = 14;

            const interval = setInterval(() => {
                reels.forEach(reel => {
                    const randomChar = CHIN_CHARS[Math.floor(Math.random() * CHIN_CHARS.length)];
                    reel.textContent = randomChar;
                    reel.className = "retro-font text-4xl md:text-6xl font-bold text-amber-900";
                });
                count++;

                if (count >= maxCounts) {
                    clearInterval(interval);
                    finalizeSpin();
                }
            }, 60);
        }

        function finalizeSpin() {
            const finalChars = reels.map(() => {
                return CHIN_CHARS[Math.floor(Math.random() * CHIN_CHARS.length)];
            });

            reels.forEach((reel, idx) => {
                reel.textContent = finalChars[idx];
            });

            currentWord = finalChars.join('');
            isSpinning = false;

            evaluateWord(currentWord);
            addHistory(currentWord);
            enableActionButtons(true);

            try {
                if (window.location.protocol !== 'blob:') {
                    const newUrl = `${window.location.pathname}?word=${currentWord}`;
                    window.history.replaceState({ word: currentWord }, '', newUrl);
                }
            } catch (e) {}
        }

        function evaluateWord(word) {
            if (word === 'ちんすこう') {
                statusBadge.textContent = "完全一致";
                resultTitle.textContent = `「${word}」 — 奇跡の正位置！`;
                resultDesc.textContent = "見事に本来の銘菓名が完成しました。素晴らしい確率です。";
                resultBox.className = "bg-emerald-50 border-2 border-emerald-700 rounded-xl p-4 text-center mb-2 shadow-sm min-h-[85px] flex flex-col items-center justify-center";
                reels.forEach(reel => reel.className = "retro-font text-4xl md:text-6xl font-bold text-emerald-700");
                return;
            }

            let title = `結果：「${word}」`;
            let desc = "文字の順序が変わるだけで、不思議な雰囲気を醸し出します。";
            let boxClass = "bg-amber-50 border-2 border-amber-800 rounded-xl p-4 text-center mb-2 shadow-sm min-h-[85px] flex flex-col items-center justify-center";
            let textColor = "text-amber-900";

            if (word.startsWith('ちんこ') || word.includes('うんこ') || word.includes('うんち')) {
                statusBadge.textContent = "おっと";
                title = `「${word}」 — ヒヤッとする並び`;
                boxClass = "bg-rose-50 border-2 border-rose-700 rounded-xl p-4 text-center mb-2 shadow-sm min-h-[85px] flex flex-col items-center justify-center";
                textColor = "text-rose-900";
            } else if (word === 'うこすんち') {
                statusBadge.textContent = "鏡の国へようこそ";
                boxClass = "bg-blue-50 border-2 border-blue-700 rounded-xl p-4 text-center mb-2 shadow-sm min-h-[85px] flex flex-col items-center justify-center";
                textColor = "text-blue-900";
            } else {
                statusBadge.textContent = "なんだろう？";
            }

            resultTitle.textContent = title;
            resultDesc.textContent = desc;
            resultBox.className = boxClass;
            reels.forEach(reel => reel.className = `retro-font text-4xl md:text-6xl font-bold ${textColor}`);
        }

        function enableActionButtons(enable) {
            if (enable) {
                shareBtn.disabled = false;
                shareBtn.className = "bg-slate-900 hover:bg-slate-800 active:scale-95 text-slate-100 font-bold py-3 px-2 rounded-2xl shadow-[0_4px_0_#0f172a] active:shadow-[0_1px_0_#0f172a] active:translate-y-1 transition-all text-xs border border-slate-700 cursor-pointer flex items-center justify-center gap-1.5";

                downloadBtn.disabled = false;
                downloadBtn.className = "bg-emerald-700 hover:bg-emerald-600 active:scale-95 text-emerald-100 font-bold py-3 px-2 rounded-2xl shadow-[0_4px_0_#065f46] active:shadow-[0_1px_0_#065f46] active:translate-y-1 transition-all text-xs border border-emerald-500 cursor-pointer flex items-center justify-center gap-1.5";

                copyUrlBtn.disabled = false;
                copyUrlBtn.className = "bg-amber-700 hover:bg-amber-600 active:scale-95 text-amber-100 font-bold py-3 px-2 rounded-2xl shadow-[0_4px_0_#78350f] active:shadow-[0_1px_0_#78350f] active:translate-y-1 transition-all text-xs border border-amber-500 cursor-pointer flex items-center justify-center gap-1.5";
            } else {
                shareBtn.disabled = true;
                shareBtn.className = "bg-slate-800/40 text-slate-400 font-bold py-3 px-2 rounded-2xl transition-all text-xs border border-slate-700/50 cursor-not-allowed flex items-center justify-center gap-1.5";

                downloadBtn.disabled = true;
                downloadBtn.className = "bg-emerald-800/40 text-emerald-300/50 font-bold py-3 px-2 rounded-2xl transition-all text-xs border border-emerald-900/50 cursor-not-allowed flex items-center justify-center gap-1.5";

                copyUrlBtn.disabled = true;
                copyUrlBtn.className = "bg-amber-800/40 text-amber-200/50 font-bold py-3 px-2 rounded-2xl transition-all text-xs border border-amber-900/50 cursor-not-allowed flex items-center justify-center gap-1.5";
            }
        }

        // Generate and download card image using html2canvas
        function downloadCardImage() {
            if (isSpinning) return;
            const targetElement = document.getElementById('captureCard');

            html2canvas(targetElement, {
                backgroundColor: '#fbbf24',
                scale: 2,
                logging: false
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `chinsukou_${currentWord}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(err => {
                console.error('Image generation failed:', err);
            });
        }

        function getResultUrl() {
            if (window.location.protocol === 'blob:') {
                return 'https://example.com/?word=' + currentWord;
            } else {
                return `${window.location.origin}${window.location.pathname}?word=${currentWord}`;
            }
        }

        function copyResultUrl() {
            if (isSpinning) return;
            const shareUrl = getResultUrl();

            const dummy = document.createElement('textarea');
            document.body.appendChild(dummy);
            dummy.value = shareUrl;
            dummy.select();
            document.execCommand('copy');
            document.body.removeChild(dummy);

            copyToast.classList.remove('hidden');
            setTimeout(() => {
                copyToast.classList.add('hidden');
            }, 3000);
        }

        function shareOnX() {
            if (isSpinning) return;
            const shareUrl = getResultUrl();
            const text = encodeURIComponent(`ちんすこうマシーンで遊んだよ！\n出来上がった文字列：【 ${currentWord} 】\n\n${shareUrl}\n\n#ちんすこうマシーン #DEEokinawa`);
            const url = `https://twitter.com/intent/tweet?text=${text}`;
            window.open(url, '_blank');
        }

        function addHistory(word) {
            if (historyArray.includes(word)) return;
            historyArray.unshift(word);
            // if (historyArray.length > 6) {
            //     historyArray.pop();
            // }
            renderHistory();
        }

        function renderHistory() {
            if (historyArray.length === 0) {
                historyList.innerHTML = '<span class="text-xs text-amber-800/70 italic">まだ履歴はありません</span>';
                return;
            }
            historyList.innerHTML = historyArray.map(w => `
                <span class="bg-amber-900 text-amber-100 font-bold text-xs px-2.5 py-1 rounded-md shadow-2xs">${w}</span>
            `).join('');
        }

        function clearHistory() {
            historyArray = [];
            renderHistory();
        }
    </script>
</body>
</html>
